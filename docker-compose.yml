version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: zerotrust
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Agent, Dashboard, etc. à ajouter plus tard

volumes:
  postgres_data: