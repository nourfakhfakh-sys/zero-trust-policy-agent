version: '3.8'

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: zerotrust_postgres
    restart: always
    environment:
      POSTGRES_DB: zerotrust
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: zerotrust123
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - zerotrust_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d zerotrust"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin (interface web pour PostgreSQL - optionnel mais utile)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: zerotrust_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@zerotrust.local
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    networks:
      - zerotrust_network
    depends_on:
      - postgres

volumes:
  postgres_data:

networks:
  zerotrust_network:
    driver: bridge